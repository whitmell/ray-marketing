<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ray Matthews Marketing Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7f4',
              100: '#d9ede2',
              500: '#4a9070',
              600: '#3d7a5e',
              700: '#2f5f49',
              800: '#244a39',
              900: '#1a362a'
            }
          }
        }
      }
    };
  </script>
  <style>
    .caption-text { white-space: pre-wrap; }

    /* Dark mode color overrides — remap Tailwind utility classes under .dark */
    .dark body { background-color: #0f172a; }
    .dark .bg-gray-50 { background-color: #0f172a; }
    .dark .bg-white { background-color: #1e293b; }

    .dark .text-gray-900 { color: #f1f5f9; }
    .dark .text-gray-800 { color: #e2e8f0; }
    .dark .text-gray-700 { color: #cbd5e1; }
    .dark .text-gray-600 { color: #94a3b8; }
    .dark .text-gray-500 { color: #94a3b8; }
    .dark .text-gray-400 { color: #64748b; }

    .dark .border-gray-200 { border-color: #334155; }
    .dark .border-gray-100 { border-color: #334155; }
    .dark .border-gray-300 { border-color: #475569; }
    .dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: #334155; }

    .dark .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.3); }

    /* Badges */
    .dark .bg-brand-100 { background-color: #1a362a; }
    .dark .text-brand-700 { color: #4a9070; }
    .dark .bg-yellow-100 { background-color: #422006; }
    .dark .text-yellow-800 { color: #fbbf24; }
    .dark .bg-green-100 { background-color: #052e16; }
    .dark .text-green-800 { color: #4ade80; }
    .dark .bg-red-100 { background-color: #450a0a; }
    .dark .text-red-700 { color: #fca5a5; }
    .dark .bg-red-50 { background-color: #450a0a; }
    .dark .border-red-200 { border-color: #7f1d1d; }
    .dark .text-red-500 { color: #f87171; }
    .dark .text-red-600 { color: #fca5a5; }
    .dark .bg-blue-100 { background-color: #1e3a5f; }
    .dark .text-blue-700 { color: #93c5fd; }
    .dark .bg-pink-100 { background-color: #4a1942; }
    .dark .text-pink-700 { color: #f9a8d4; }
    .dark .bg-green-50 { background-color: #052e16; }
    .dark .border-green-200 { border-color: #166534; }
    .dark .text-green-700 { color: #4ade80; }
    .dark .bg-yellow-50 { background-color: #422006; }
    .dark .border-yellow-200 { border-color: #854d0e; }
    .dark .text-yellow-600 { color: #fbbf24; }

    /* Buttons */
    .dark .bg-white.border { background-color: #1e293b; }
    .dark .hover\:bg-gray-50:hover { background-color: #334155 !important; }

    /* Form controls */
    .dark textarea,
    .dark input[type="text"] {
      background-color: #0f172a;
      color: #e2e8f0;
      border-color: #475569;
    }
    .dark textarea:focus,
    .dark input[type="text"]:focus {
      border-color: #4a9070;
    }
    .dark input[type="checkbox"] {
      background-color: #0f172a;
      border-color: #475569;
    }

    /* Modal */
    .dark .bg-black\/50 { background-color: rgb(0 0 0 / 0.7); }

    /* Purple post button */
    .dark .bg-purple-600 { background-color: #7c3aed; }
    .dark .hover\:bg-purple-700:hover { background-color: #6d28d9 !important; }

    /* Candidate panels */
    .dark .bg-brand-50 { background-color: #1a362a; }
    .dark .bg-gray-200 { background-color: #334155; }

    /* Theme toggle */
    #theme-toggle { cursor: pointer; background: none; border: none; color: inherit; padding: 0.25rem; }
    #theme-toggle:hover { opacity: 0.8; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-brand-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" data-link class="block">
        <h1 class="text-xl font-semibold">Ray Matthews Photography</h1>
        <p class="text-brand-100 text-sm">Marketing Pipeline</p>
      </a>
      <button id="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()">
        <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="4.22" x2="19.78" y2="5.64"/></svg>
        <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </nav>
  <main id="app" class="max-w-6xl mx-auto px-4 py-6"></main>
  <script>
    function toggleTheme() {
      var html = document.documentElement;
      var isDark = html.classList.toggle('dark');
      try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
      updateThemeIcon(isDark);
    }
    function updateThemeIcon(isDark) {
      document.getElementById('theme-icon-sun').classList.toggle('hidden', isDark);
      document.getElementById('theme-icon-moon').classList.toggle('hidden', !isDark);
    }
    (function () {
      var saved;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
        updateThemeIcon(false);
      } else {
        updateThemeIcon(true);
      }
    })();
  </script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
